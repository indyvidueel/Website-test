<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>De Journal1st</title>
  <meta name="description" content="Modern news website homepage with headlines, top stories, and latest updates." />
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem("journal1st-theme") === "light" ? "light" : "dark";
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f2f7;
      --panel: #ffffff;
      --panel-soft: #eee8f2;
      --text: #241d29;
      --muted: #655b6b;
      --line: rgba(60, 40, 70, 0.16);
      --accent: #522169;
      --accent-2: #704080;
      --highlight: #f9e276;
      --category-color: var(--accent-2);
      --category-nav-color: var(--muted);
      --category-nav-hover: var(--text);
      --page-top: #ffffff;
      --topbar-bg: rgba(255, 255, 255, 0.94);
      --card-shadow: 0 14px 28px rgba(44, 23, 54, 0.08);
      --shadow: 0 18px 40px rgba(44, 23, 54, 0.12);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #18151b;
      --panel: #29242e;
      --panel-soft: #372d3d;
      --text: #f4edf7;
      --muted: #c1b6c8;
      --line: rgba(235, 220, 245, 0.17);
      --accent: #81499a;
      --accent-2: #d0a6e2;
      --category-color: var(--highlight);
      --category-nav-color: var(--highlight);
      --category-nav-hover: var(--highlight);
      --page-top: #231e28;
      --topbar-bg: rgba(35, 30, 40, 0.94);
      --card-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: linear-gradient(180deg, var(--page-top) 0%, var(--bg) 100%);
      color: var(--text);
      line-height: 1.6;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      border-bottom: 1px solid var(--line);
      background: var(--topbar-bg);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      padding: 10px;
      border-radius: 12px;
      background: var(--accent);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 10px 14px;
      color: var(--category-nav-color);
      font-weight: 500;
      font-size: 0.8rem;
      flex-wrap: wrap;
    }

    .nav a {
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .nav a:hover {
      color: var(--category-nav-hover);
    }

    .nav a[aria-current="page"] {
      color: var(--category-color);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .theme-toggle {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 50%;
      padding: 0;
      font: inherit;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 2px;
    }

    .theme-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .theme-icon-sun,
    :root[data-theme="dark"] .theme-icon-moon {
      display: none;
    }

    :root[data-theme="dark"] .theme-icon-sun {
      display: block;
    }

    .search-input {
      width: min(240px, 42vw);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }

    .search-input:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 2px;
    }

    .meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .eyebrow {
      color: var(--category-color);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .story h3 {
      margin: 10px 0 0;
      line-height: 1.25;
      letter-spacing: -0.04em;
    }

    .section {
      padding: 26px 0;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 16px;
    }

    .section-head h1 {
      margin: 0;
      font-size: clamp(1.7rem, 2vw, 2.4rem);
      letter-spacing: -0.05em;
    }

    .inline-link {
      color: var(--accent-2);
      font-weight: 700;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .news-status {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .news-status[hidden] {
      display: none;
    }

    .story {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .story:hover,
    .story:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent-2);
    }

    .story:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 3px;
    }

    .story img {
      width: 100%;
      height: 210px;
      object-fit: cover;
    }

    .story .content {
      padding: 18px 18px 22px;
    }

    .story h3 {
      font-size: 1.35rem;
    }

    .story p {
      margin: 10px 0 0;
      color: var(--muted);
    }

    .story .meta-row {
      color: var(--muted);
      margin-top: 12px;
    }

    .article-dialog {
      width: min(760px, calc(100% - 32px));
      max-height: min(85vh, 900px);
      padding: 0;
      overflow: auto;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .article-dialog::backdrop {
      background: rgba(0, 0, 0, 0.76);
      backdrop-filter: blur(5px);
    }

    .article-dialog-image {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
    }

    .article-dialog-content {
      padding: clamp(22px, 5vw, 40px);
    }

    .article-dialog-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .article-dialog h2 {
      margin: 8px 0 0;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      line-height: 1.15;
      letter-spacing: -0.05em;
    }

    .article-dialog-close {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--panel-soft);
      color: var(--text);
      font: inherit;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
    }

    .article-dialog-close:hover {
      background: var(--accent);
      color: #ffffff;
    }

    .article-dialog .meta-row {
      margin-top: 14px;
      color: var(--muted);
    }

    .article-dialog-body {
      margin: 0;
      color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    footer {
      padding: 50px 0 30px;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-top: 1px solid var(--line);
      padding-top: 26px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    @media (max-width: 980px) {

      .news-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .topbar-inner {
        flex-wrap: wrap;
        justify-content: center;
        padding: 14px 0;
      }

      .nav {
        justify-content: center;
      }

      .nav-actions {
        width: 100%;
        justify-content: center;
      }

      .news-grid {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html" aria-label="De Journal1st home">
        <div class="brand-mark"><img src="assets/journal-mark.png" alt="" /></div>
        <span>De Journal1st</span>
      </a>

      <nav class="nav" aria-label="News categories">
        <a href="#latest-news" data-category-filter="Noord-Holland">Noord-Holland</a>
        <a href="#latest-news" data-category-filter="Amsterdam en omgeving">Amsterdam en omgeving</a>
        <a href="#latest-news" data-category-filter="Utrecht en Amersfoort">Utrecht en Amersfoort</a>
        <a href="#latest-news" data-category-filter="Oost-Nederland">Oost-Nederland</a>
        <a href="#latest-news" data-category-filter="Zuid-Holland- West-Brabant-Rivierenland">Zuid-Holland-
          West-Brabant-Rivierenland</a>
      </nav>

      <div class="nav-actions">
        <button class="search-btn" id="search-button" type="button" aria-label="Search articles" aria-expanded="false"
          aria-controls="article-search">Search</button>
        <input class="search-input" id="article-search" type="search" placeholder="Search articles"
          aria-label="Search articles" hidden />
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode"
          title="Switch to dark mode" aria-pressed="false">
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" />
          </svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="section" id="latest-news">
      <div class="container">
        <div class="section-head">
          <h1>Latest News</h1>
          <a href="upload-news.html" class="inline-link">Submit a story</a>
        </div>

        <p class="news-status" id="database-news-status" role="status" aria-live="polite" hidden></p>
        <p class="news-status" id="empty-news" hidden>No articles have been added to the database yet.</p>
        <p class="news-status" id="search-no-results" role="status" aria-live="polite" hidden>No articles match your
          search.</p>
        <div class="news-grid" id="latest-news-grid">
        </div>
      </div>
    </section>
  </main>

  <dialog class="article-dialog" id="article-dialog" aria-labelledby="dialog-title">
    <img class="article-dialog-image" id="dialog-image" alt="" hidden />
    <div class="article-dialog-content">
      <div class="article-dialog-header">
        <div>
          <span class="eyebrow" id="dialog-category"></span>
          <h2 id="dialog-title"></h2>
        </div>
        <button class="article-dialog-close" id="dialog-close" type="button" aria-label="Close article">×</button>
      </div>
      <div class="meta-row">
        <span id="dialog-author"></span>
        <span aria-hidden="true">•</span>
        <time id="dialog-date"></time>
      </div>
      <p class="article-dialog-body" id="dialog-body"></p>
    </div>
  </dialog>

  <footer>
    <div class="container footer-inner">
      <div class="brand" aria-label="De Journal1st footer logo">
        <div class="brand-mark"><img src="assets/journal-mark.png" alt="" /></div>
        <span>De Journal1st</span>
      </div>

      <div class="footer-links" aria-label="Footer links">
        <a href="upload-news.html">Submit a story</a>
        <a href="mailto:klasd01svj@gmail.com">Contact</a>
      </div>

      <span>© 2026 Indy Steemers</span>
    </div>
  </footer>
  <script>
    const latestNewsGrid = document.getElementById("latest-news-grid");
    const databaseNewsStatus = document.getElementById("database-news-status");
    const emptyNews = document.getElementById("empty-news");
    const searchButton = document.getElementById("search-button");
    const articleSearch = document.getElementById("article-search");
    const searchNoResults = document.getElementById("search-no-results");
    const categoryFilterLinks = document.querySelectorAll("[data-category-filter]");
    const articleDialog = document.getElementById("article-dialog");
    const themeToggle = document.getElementById("theme-toggle");
    const dialogImage = document.getElementById("dialog-image");
    const dialogCategory = document.getElementById("dialog-category");
    const dialogTitle = document.getElementById("dialog-title");
    const dialogAuthor = document.getElementById("dialog-author");
    const dialogDate = document.getElementById("dialog-date");
    const dialogBody = document.getElementById("dialog-body");
    let selectedCategory = "";

    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.documentElement.dataset.theme = isDark ? "dark" : "light";
      const actionLabel = isDark ? "Switch to light mode" : "Switch to dark mode";
      themeToggle.setAttribute("aria-label", actionLabel);
      themeToggle.title = actionLabel;
      themeToggle.setAttribute("aria-pressed", String(isDark));
    }

    applyTheme(document.documentElement.dataset.theme);
    themeToggle.addEventListener("click", () => {
      const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem("journal1st-theme", theme);
      applyTheme(theme);
    });

    function filterArticles() {
      const query = articleSearch.value.trim().toLowerCase();
      const cards = latestNewsGrid.querySelectorAll(".story");
      let visibleCount = 0;

      cards.forEach((card) => {
        const matches = card.dataset.searchText.includes(query)
          && (!selectedCategory || card.dataset.category === selectedCategory);
        card.hidden = !matches;
        if (matches) visibleCount += 1;
      });

      searchNoResults.hidden = (!query && !selectedCategory) || cards.length === 0 || visibleCount > 0;
      if (!searchNoResults.hidden) {
        searchNoResults.textContent = selectedCategory
          ? `No articles found in ${selectedCategory}${query ? ` matching "${query}"` : ""}.`
          : "No articles match your search.";
      }
    }

    categoryFilterLinks.forEach((link) => {
      link.addEventListener("click", () => {
        const clearFilters = selectedCategory === link.dataset.categoryFilter;
        selectedCategory = clearFilters ? "" : link.dataset.categoryFilter;
        if (clearFilters) articleSearch.value = "";

        categoryFilterLinks.forEach((categoryLink) => {
          if (!clearFilters && categoryLink === link) {
            categoryLink.setAttribute("aria-current", "page");
          } else {
            categoryLink.removeAttribute("aria-current");
          }
        });
        filterArticles();
      });
    });

    searchButton.addEventListener("click", () => {
      if (articleSearch.hidden) {
        articleSearch.hidden = false;
        searchButton.setAttribute("aria-expanded", "true");
        articleSearch.focus();
        return;
      }

      articleSearch.value = "";
      articleSearch.hidden = true;
      searchButton.setAttribute("aria-expanded", "false");
      filterArticles();
      searchButton.focus();
    });

    articleSearch.addEventListener("input", filterArticles);
    articleSearch.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        articleSearch.value = "";
        articleSearch.hidden = true;
        searchButton.setAttribute("aria-expanded", "false");
        filterArticles();
        searchButton.focus();
      }
    });

    function createDatabaseArticle(article) {
      const card = document.createElement("article");
      card.className = "story";
      card.dataset.category = article.category;
      card.dataset.searchText = [
        article.title,
        article.category,
        article.author,
        article.summary,
        article.body
      ].filter(Boolean).join(" ").toLowerCase();
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-haspopup", "dialog");
      card.setAttribute("aria-label", `Read full article: ${article.title}`);
      card.addEventListener("click", () => openArticle(article));
      card.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openArticle(article);
        }
      });

      if (article.image_url) {
        const image = document.createElement("img");
        image.src = article.image_url;
        image.alt = article.title;
        image.loading = "lazy";
        card.append(image);
      }

      const content = document.createElement("div");
      content.className = "content";

      const category = document.createElement("span");
      category.className = "eyebrow";
      category.textContent = article.category;

      const headline = document.createElement("h3");
      headline.textContent = article.title;

      const summary = document.createElement("p");
      summary.textContent = article.summary;

      const meta = document.createElement("div");
      meta.className = "meta-row";
      const byline = document.createElement("span");
      byline.textContent = `By ${article.author}`;
      const separator = document.createElement("span");
      separator.textContent = "•";
      const date = document.createElement("span");
      date.textContent = new Date(article.created_at).toLocaleDateString();
      meta.append(byline, separator, date);

      content.append(category, headline, summary, meta);
      card.append(content);
      return card;
    }

    function openArticle(article) {
      dialogCategory.textContent = article.category;
      dialogTitle.textContent = article.title;
      dialogAuthor.textContent = `By ${article.author}`;
      dialogDate.dateTime = article.created_at;
      dialogDate.textContent = new Date(article.created_at).toLocaleDateString();
      dialogBody.textContent = article.body;

      if (article.image_url) {
        dialogImage.src = article.image_url;
        dialogImage.alt = article.title;
        dialogImage.hidden = false;
      } else {
        dialogImage.removeAttribute("src");
        dialogImage.alt = "";
        dialogImage.hidden = true;
      }

      articleDialog.showModal();
    }

    document.getElementById("dialog-close").addEventListener("click", () => articleDialog.close());
    articleDialog.addEventListener("click", (event) => {
      if (event.target === articleDialog) articleDialog.close();
    });

    async function showDatabaseArticles() {
      if (location.protocol === "file:") {
        throw new Error("Open http://127.0.0.1:2121/index.html instead of this file; local files cannot connect to the database.");
      }
      const response = await fetch("/api/articles");
      if (!response.ok) {
        throw new Error(`The article server returned ${response.status}.`);
      }

      const articles = await response.json();
      if (!Array.isArray(articles)) {
        throw new Error("The article server returned invalid data.");
      }

      const cards = document.createDocumentFragment();
      articles.forEach((article) => cards.append(createDatabaseArticle(article)));
      latestNewsGrid.prepend(cards);
      emptyNews.hidden = articles.length > 0;
      filterArticles();
    }

    showDatabaseArticles().catch((error) => {
      databaseNewsStatus.textContent = `New articles couldn't load: ${error.message}`;
      databaseNewsStatus.hidden = false;
    });
  </script>
</body>

</html>
